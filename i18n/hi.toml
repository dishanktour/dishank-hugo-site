[p1_label]
other = "परिचय"

[p1_heading]
other = "यात्रा तब बदल जाती है, जब सलाह ईमानदार हो।"

[p1_body]
other = "ओडिशा अविस्मरणीय अनुभवों से भरा है, लेकिन कुछ फैसले आपकी यात्रा को गहराई से प्रभावित करते हैं - कहाँ ठहरें, किस पर भरोसा करें, और किससे बचें। Dishank (दिशांक) का उद्देश्य अनिश्चितता की जगह ईमानदार स्थानीय मार्गदर्शन प्रदान करना है, ताकि हर निर्णय आपका अपना हो, किसी और का कमीशन नहीं।"

[p1_note_header]
other = "फील्ड नोट"

[p1_note_text]
other = "अधिकतर यात्रा संबंधी गलतियाँ यात्रा शुरू होने से पहले ही हो जाती हैं।"

[p1_promise_title]
other = "Dishank (दिशांक) का वादा"

[p1_rule_1_title]
other = "ईमानदार सलाह"

[p1_rule_1_desc]
other = "हर सिफारिश की शुरुआत इस बात से होती है कि आपकी यात्रा के लिए क्या सही है।"

[p1_rule_2_title]
other = "शून्य कमीशन"

[p1_rule_2_desc]
other = "कोई होटल नहीं, कोई ड्राइवर नहीं, कोई छुपा हुआ लालच नहीं। हमारी राय निष्पक्ष है।"

[p1_rule_3_title]
other = "निर्णय लेने से पहले सत्यापन"

[p1_rule_3_desc]
other = "जरूरत पड़ने पर, आपके बुकिंग करने से पहले हम होटलों और सेवाओं का सत्यापन करते हैं।"


