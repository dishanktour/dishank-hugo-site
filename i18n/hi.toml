[p3_label]
other = "मूड इंजन"

[p3_heading]
other = "यात्रा तब बदलती है जब आपकी योजना आपकी वास्तविक भावनाओं का सम्मान करती है।"

[p3_body]
other = "सामान्य ट्रैवल पैकेज कठोर समय-सारणी और व्यावसायिक पर्यटन रास्तों को बढ़ावा देते हैं। Dishank (दिशांक) मूड इंजन आपकी यात्रा की मानसिकता को समझता है—चाहे आप शांत आध्यात्मिक स्थल चाहते हों, अछूते तटीय क्षेत्र, या प्राचीन पुरातात्विक धरोहर—इससे पहले कि कोई बुकिंग निर्णय लिया जाए।"

[p3_warning_title]
other = "महत्वपूर्ण कार्यान्वयन नोट"

[p3_warning_text]
other = "कटक, भुवनेश्वर और पुरी की यात्रा का खर्च ₹1,000 से ₹30,000 प्रति दिन के बीच कहीं भी हो सकता है। यह कभी केवल पैसे का सवाल नहीं होता—यह पूरी तरह से सटीक योजना और व्यक्तिगत पसंद पर निर्भर करता है। एक गलत योजना आपको बहुत महंगी पड़ सकती है।"

[p3_support_title]
other = "सहायता का अपना स्तर चुनें"

[p3_plan_1_title]
