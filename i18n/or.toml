# Customer Stories
[story_1_title]
other = "ଯାତ୍ରା ବାହାରେ: ଏକ ନୂଆ ବନ୍ଧୁତାର ଆରମ୍ଭ"

[story_1_body]
other = "“ଅନଲାଇନ୍ ଠକାମିରୁ ରକ୍ଷା କରି, Dishank (ଦିଶାଙ୍କ) ର ମାର୍ଗଦର୍ଶନ ଏକ ଚିନ୍ତାଜନକ ଯାତ୍ରାକୁ ସେମାନଙ୍କର ସର୍ବୋତ୍ତମ ଛୁଟିଦିନରେ ପରିଣତ କଲା। ମାସ ମାସ ପରେ ବି, ସେମାନେ ଆମକୁ ଫୋନ୍ କରି ପ୍ରକୃତ ଓଡ଼ିଶା ରସଗୋଲା ବିଷୟରେ ପଚାରନ୍ତି!”"

[story_2_title]
other = "ଅଜଣା ବ୍ୟକ୍ତିଙ୍କଠାରୁ ଏକାଠି ମଧ୍ୟାହ୍ନ ଭୋଜନ ପର୍ଯ୍ୟନ୍ତ"

[story_2_body]
other = "“ରାସ୍ତାରେ ଅସହାୟ ଭାବରେ ପଡ଼ିରହିଥିବା ଏକ ଦମ୍ପତିଙ୍କୁ ଦେଖି, Dishank (ଦିଶାଙ୍କ) ସଠିକ୍ ସ୍ଥାନୀୟ ଦିଗଦର୍ଶନ ସହିତ ସାହାଯ୍ୟ କଲା। ଦିଲ୍ଲୀ ଫେରିବା ପୂର୍ବରୁ, ସେମାନେ ଆମ ଡ୍ରାଇଭରଙ୍କୁ ବିଦାୟୀ ଭୋଜନ ଦେବାକୁ ଜିଦ୍ ଧରିଥିଲେ।”"

[story_3_title]
other = "ସେହି ସାଥୀ ଯିଏ ପ୍ରଭେଦ ସୃଷ୍ଟି କଲେ"

[story_3_body]
other = "“ଭବିଷ୍ୟତ ପାଇଁ ଗାଡ଼ି ସୁପାରିଶ ପଚାରିବାରୁ, ବାଙ୍ଗାଲୋରର ଜଣେ ଯାତ୍ରୀ ଉତ୍ତର ଦେଲେ: 'ମୁଁ ଆପଣଙ୍କୁ କେବଳ ଗୋଟିଏ ସର୍ତ୍ତରେ ଅନ୍ୟ କାହାକୁ ସୁପାରିଶ କରିବି—ଯଦି ଏହି Dishank (ଦିଶାଙ୍କ) ଡ୍ରାଇଭର୍ ସେମାନଙ୍କୁ ସାହାଯ୍ୟ କରନ୍ତି।'”"

[story_4_title]
other = "ଛାତ୍ରଙ୍କ ବଜେଟ୍ ପାଇଁ ଅତୁଳନୀୟ ଯତ୍ନ"

[story_4_body]
other = "“ଯେତେବେଳେ କଲେଜ ଛାତ୍ରମାନେ ସୀମିତ ବଜେଟ୍ ଏବଂ ୨୪ ଘଣ୍ଟା ସମୟ ମଧ୍ୟରେ ପରୀକ୍ଷା ପାଇଁ ପହଞ୍ଚିଲେ, Dishank (ଦିଶାଙ୍କ) ସବୁକିଛି ବ୍ୟବସ୍ଥା କଲା। ସେମାନେ ସେମାନଙ୍କର ସୀମିତ ବଜେଟ୍ ମଧ୍ୟରେ ଆନ୍ତରିକ ସେବାର ପ୍ରଶଂସା କରି ଫେରିଲେ।”"

[story_5_title]
other = "ଅକଥନୀୟ ପାରିବାରିକ ବିଶ୍ୱାସର ଉପହାର"

[story_5_body]
other = "“୩ ଦିନର ବିବାହ ଯାତ୍ରାରେ ଜଣେ ବୃଦ୍ଧା ମା' ଏବଂ ଝିଅଙ୍କୁ ମାର୍ଗଦର୍ଶନ କରି, ସେମାନେ ଆମ ଡ୍ରାଇଭରଙ୍କ ପୁଅ ପାଇଁ ଏକ ଉପହାର ଦେଇ ବିଦାୟ ନେଲେ ଏବଂ ସମ୍ପୂର୍ଣ୍ଣ ପରିବାରକୁ Dishank (ଦିଶାଙ୍କ) ର ସୁପାରିଶ କଲେ।”"

[story_6_title]
other = "ସହରର ସବୁଠାରୁ ସୁରକ୍ଷିତ ନାମ"

[story_6_body]
other = "“ସନ୍ଧ୍ୟାର ମାତ୍ର ଦୁଇଟି ଛୋଟ ଗସ୍ତରେ, କେନ୍ଦ୍ରୀୟ ବିଦ୍ୟାଳୟର ଶିକ୍ଷକମାନେ ଏପରି ଏକ ଦୃଢ଼ ସମ୍ପର୍କ ଗଢ଼ିତୋଳିଲେ ଯେ ସେମାନେ ମହିଳା ଶିକ୍ଷକ ସମୂହକୁ ଭୁବନେଶ୍ୱରର ସବୁଠାରୁ ସୁରକ୍ଷିତ ସାଥୀ ଭାବରେ Dishank (ଦିଶାଙ୍କ) ର ସୁପାରିଶ କଲେ।”"

[story_7_title]
other = "ସମ୍ପୂର୍ଣ୍ଣ ସୁରକ୍ଷା କିପରି ନିୟମକୁ ସ୍ୱାଧୀନତାରେ ପରିଣତ କରେ"

[story_7_body]
other = "“ରାତି ୧୧ଟାର କଠୋର ସମୟସୀମା ସହିତ ପହଞ୍ଚି, ମହିଳା ଶିକ୍ଷକମାନଙ୍କର ଏକ ଦଳ Dishank (ଦିଶାଙ୍କ) ସହିତ ସେମାନଙ୍କର ପ୍ରଥମ ଯାତ୍ରା କଲେ। ବିଶ୍ୱାସ ଏତେ ତୁରନ୍ତ ଥିଲା ଯେ ସମୟସୀମା ଭୋର ୩ଟାର ଡ୍ରାଇଭରେ ପରିଣତ ହେଲା।”"

[story_8_title]
other = "ସମ୍ପୂର୍ଣ୍ଣ ବିଶ୍ୱାସ: \"ବସ୍ ଆପଣଙ୍କ ପସନ୍ଦ ଅନୁଯାୟୀ ଯୋଜନା କରନ୍ତୁ\""

[story_8_body]
other = "“ଛଅ ମାସ ପରେ ଏକ ନୂଆ ଦଳ ସହିତ ଫେରି, ସେ ରୁଟ୍ ଯାଞ୍ଚ ସମ୍ପୂର୍ଣ୍ଣ ଏଡ଼ାଇ ଗଲେ, ଆମକୁ ସେମାନଙ୍କର ସମୟସୂଚୀ ଦେଲେ ଏବଂ Dishank (ଦିଶାଙ୍କ) କୁ କହିଲେ: 'ଆପଣଙ୍କ ପସନ୍ଦ ଅନୁଯାୟୀ ସବୁକିଛି ପ୍ଲାନ୍ କରନ୍ତୁ।'”"

[story_9_title]
other = "ଜ୍ଞାନର ସେବା: ବୃଦ୍ଧବୃଦ୍ଧାଙ୍କ ଯତ୍ନର ଆନନ୍ଦ"

[story_9_body]
other = "“ଗୁଜରାଟର ଜଣେ ଅବସରପ୍ରାପ୍ତ ଅଫିସର ଦମ୍ପତିଙ୍କ ସେବା କରିବା ଆମକୁ ମନେ ପକାଇଦେଲା ଯେ ପ୍ରକୃତ ସୁବିଧା ହେଉଛି ସମ୍ମାନ। ଆମର ସମ୍ପୂର୍ଣ୍ଣ ଫିସ୍ ଦେବା ବ୍ୟତୀତ, ସେମାନଙ୍କର ଆନ୍ତରିକ ଆଶୀର୍ବାଦ Dishank (ଦିଶାଙ୍କ) ପାଇଁ ସବୁକିଛି ଥିଲା।”"

[story_10_title]
other = "ସ୍ୱାଭାବିକ ଭାବନା ରଖୁଥିବା ଲୋକଙ୍କ ପାଇଁ ଅତୁଳନୀୟ ଧୈର୍ଯ୍ୟ"

[story_10_body]
other = "“ଯେତେବେଳେ ବନ୍ଧୁମାନଙ୍କର ଏକ ଦଳ ୩ ଦିନ ଧରି ପ୍ରତି ତିନି ଘଣ୍ଟାରେ ସେମାନଙ୍କର ଯାତ୍ରା ଯୋଜନା ବଦଳାଇଲେ, Dishank (ଦିଶାଙ୍କ) ବିନା କୌଣସି ଅସୁବିଧାରେ ସାମଞ୍ଜସ୍ୟ ରଖିଲା। ଆଜି, ସେମାନେ ଆମର ଆଜୀବନ ବନ୍ଧୁ।”"

[story_11_title]
other = "ଏକ ସହଜ ଏବଂ ସୁନ୍ଦର ଅନୁଭୂତିର ଶକ୍ତି"

[story_11_body]
