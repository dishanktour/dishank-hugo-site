baseURL = "https://godishank.com/"
title = "Dishank – REAL TRAVEL WITH RIGHT DIRECTIONS"
languageCode = "en-us"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]
canonifyURLs = false
relativeURLs = true
googleAnalytics = "G-5VKEMZVWD5"

[pagination]
  pagerSize = 6

[params]
  description = "Travel Odisha with clarity, cultural depth, transparent ground support, and honest local guidance."
  tagline = "REAL TRAVEL WITH RIGHT DIRECTIONS"
  author = "Dishank"
  phone = "919827131776"
  whatsappMessage = "Hello Dishank, I would like to understand Odisha better before my trip."

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content/en"

  [languages.hi]
    languageName = "हिन्दी"
    weight = 2
    contentDir = "content/hi"

  [languages.or]
    languageName = "ଓଡ଼ିଆ"
    weight = 3
    contentDir = "content/or"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = "weekly"
  priority = 0.8